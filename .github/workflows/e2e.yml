name: e2e

# Live layers (docs/specs/testing-strategy.md §6). The scripted Playwright job runs in ci.yml.
# Nightly runs are opt-in: set the repository variable NIGHTLY_LIVE=true (they cost model calls).

on:
  workflow_dispatch:
  schedule:
    - cron: '30 21 * * *' # 03:00 IST / 00:30 Asia/Riyadh

jobs:
  playwright-live:
    if: github.event_name == 'workflow_dispatch' || vars.NIGHTLY_LIVE == 'true'
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      # Accept the model as a repository variable (preferred) or a secret.
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || secrets.OPENAI_MODEL }}
    steps:
      - name: Check OpenAI settings
        run: |
          missing=0
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY is empty. Add it as a repository secret (Settings > Secrets and variables > Actions > Secrets)."
            missing=1
          fi
          if [ -z "$OPENAI_MODEL" ]; then
            echo "::error::OPENAI_MODEL is empty. Add it as a repository variable (Settings > Secrets and variables > Actions > Variables)."
            missing=1
          fi
          exit $missing
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        run: |
          (cd backend && uv sync)
          (cd frontend && npm ci)
          (cd e2e && npm ci && npx playwright install --with-deps chromium webkit)
      - name: Run live e2e
        run: make e2e-live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-live-report
          path: |
            e2e/playwright-report/
            e2e/results/
