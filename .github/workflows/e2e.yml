name: e2e

# Playwright in CI (docs/specs/testing-strategy.md §6).
# Every pull request to main runs the INT layer (@scripted, which includes @demo-18nov) and the
# FE layer (@fe) here, so nobody has to run them locally first. Browsers are cached between runs.
# The suites below can also be started by hand; the live ones (model cost) only run that way.
#   Run workflow → suite "scripted": the INT layer (@scripted), desktop Chrome + mobile WebKit.
#   Run workflow → suite "demo_18nov": the 18 Nov demo stories NV01–NV11 alone (`make e2e-nov18`,
#     @demo-18nov), desktop Chrome + mobile WebKit; passes with no tests until they land.
#   Run workflow → suite "qa": docs/scenario-queries.md automated (`make e2e-qa`, @qa-scripted).
#   Run workflow → suite "qa_live": the same with the real model (`make e2e-qa-live`, @qa-live).
#   Run workflow → suite "live": the E2E-LIVE layer (@live), real model.
#   Run workflow → suite "eval": AGENT-LIVE (`make eval-live`). group "nov18" runs the seven
#     18 Nov demo groups (docs/specs/demo-18nov-feedback.md §6); before their scenarios land,
#     those groups run nothing and pass.
#   Run workflow → suite "fe": the FE layer (@fe), frontend mock only (`make e2e-fe`).
#     With "update_snapshots" on a branch other than main, the card screenshot baselines are
#     (re)written on ubuntu-latest and committed to that branch.
#   Run workflow → suite "demo": the Day 5 demo rehearsal (`make e2e-demo`, @demo); set
#     state_backend=postgres to rehearse on the store `make demo` uses.
#   Run workflow → suite "demo_stack": the restart beat (D10) on the Docker demo stack:
#     `make demo` in the background, then `make e2e-demo-stack` (no model needed).
# Nightly live runs are opt-in: set the repository variable NIGHTLY_LIVE=true (model cost).

on:
  pull_request:
    branches: [main]
    # Docs-only changes don't need a browser run (the catalogue, docs/flow-v2, still does).
    paths-ignore:
      - 'prompts/**'
      - 'docs/specs/**'
      - 'docs/testing/**'
      - 'docs/*.md'
      - '**/README.md'
  workflow_dispatch:
    inputs:
      suite:
        description: Which suite to run
        type: choice
        options: [scripted, demo_18nov, qa, qa_live, live, eval, fe, demo, demo_stack]
        default: scripted
      group:
        description: eval-live scenario group (eval suite only)
        type: choice
        options:
          [
            conversation,
            case,
            channels,
            signatory,
            flow_v2,
            nov18,
            category_options,
            leasing_team_tone,
            email_pending,
            property_sequence,
            mall_fuzzy,
            case_actions,
            track_privacy,
            all,
          ]
        default: all
      scenario:
        description: eval-live scenarios whose name contains this text (eval suite only; empty = all)
        type: string
        default: ''
      args:
        description: Extra Playwright arguments (scripted, demo_18nov, qa and qa_live suites), e.g. --grep @flow-v2
        type: string
        default: ''
      update_snapshots:
        description: Rewrite the card screenshot baselines (fe suite only)
        type: boolean
        default: false
      state_backend:
        description: Backend state store (demo suite only); postgres is what `make demo` runs
        type: choice
        options: [memory, postgres]
        default: memory
  schedule:
    - cron: '30 21 * * *' # 03:00 IST / 00:30 Asia/Riyadh

# A newer push to the same PR cancels the run still going.
concurrency:
  group: e2e-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  playwright-fe:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.suite == 'fe')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # only used to commit screenshot baselines (update_snapshots)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}
      - name: Install deps
        run: |
          (cd frontend && npm ci)
          (cd e2e && npm ci && npx playwright install --with-deps chromium webkit)
      - name: Frontend Playwright (@fe)
        if: ${{ !inputs.update_snapshots }}
        run: set -o pipefail; make e2e-fe 2>&1 | tee /tmp/playwright.log
      - name: Write card screenshot baselines
        if: ${{ inputs.update_snapshots }}
        run: set -o pipefail; make e2e-fe ARGS='--update-snapshots=all tests/fe/card-screenshots.spec.ts' 2>&1 | tee /tmp/playwright.log
      - name: Show the end of the Playwright output
        if: failure()
        run: |
          if [ -f /tmp/playwright.log ]; then
            body=$(tail -n 60 /tmp/playwright.log | sed -e 's/\x1b\[[0-9;]*m//g' -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Playwright output (last 60 lines)::${body}"
          fi
      - name: Commit card screenshot baselines to this branch
        if: ${{ inputs.update_snapshots && github.ref != 'refs/heads/main' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/tests/fe/card-screenshots.spec.ts-snapshots/
          if git diff --cached --quiet; then echo "Baselines unchanged"; exit 0; fi
          git commit -m "e2e: card screenshot baselines (ubuntu-latest, run ${{ github.run_id }})"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-fe-report
          path: e2e/playwright-report/

  playwright-demo:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'demo'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: inquiry
          POSTGRES_PASSWORD: inquiry
          POSTGRES_DB: inquiry
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inquiry -d inquiry"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The backend web server inherits these (Playwright webServer env extends process.env).
      STATE_BACKEND: ${{ inputs.state_backend || 'memory' }}
      DATABASE_URL: postgresql+psycopg://inquiry:inquiry@localhost:5432/inquiry
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - name: Install deps
        run: |
          (cd backend && uv sync)
          (cd frontend && npm ci)
          (cd e2e && npm ci && npx playwright install --with-deps chromium)
      - name: Alembic migrate (postgres)
        if: ${{ inputs.state_backend == 'postgres' }}
        run: cd backend && uv run alembic upgrade head
      - name: Demo rehearsal (@demo)
        run: set -o pipefail; make e2e-demo 2>&1 | tee /tmp/playwright.log
      - name: Show the end of the Playwright output
        if: failure()
        run: |
          if [ -f /tmp/playwright.log ]; then
            body=$(tail -n 60 /tmp/playwright.log | sed -e 's/\x1b\[[0-9;]*m//g' -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Playwright output (last 60 lines)::${body}"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-demo-report
          path: |
            e2e/playwright-report/
            e2e/test-results/

  playwright-demo-stack:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'demo_stack'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: backend/.env for the stack
        # docker-compose.yml reads backend/.env. The restart test makes no model call, so
        # the agent runs scripted and no key is needed.
        run: |
          cp backend/.env.example backend/.env
          sed -i 's/^AGENT_MODE=.*/AGENT_MODE=scripted/' backend/.env
      - name: Start the demo stack (make demo, detached)
        run: |
          docker compose -f docker-compose.yml -f docker-compose.demo.yml up -d --build
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8000/api/health >/dev/null && curl -fsS http://127.0.0.1:5173 >/dev/null; then
              echo "stack up after $((i * 5)) s"; exit 0
            fi
            sleep 5
          done
          docker compose -f docker-compose.yml -f docker-compose.demo.yml logs --tail 80
          exit 1
      - name: Install Playwright
        run: cd e2e && npm ci && npx playwright install --with-deps chromium
      - name: Restart beat (make e2e-demo-stack)
        run: set -o pipefail; make e2e-demo-stack 2>&1 | tee /tmp/playwright.log
      - name: Stack logs
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.demo.yml logs --tail 120 backend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-demo-stack-report
          path: |
            e2e/playwright-report/
            e2e/test-results/

  playwright-scripted:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.suite == 'scripted')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}
      - name: Install deps
        run: |
          (cd backend && uv sync)
          (cd frontend && npm ci)
          (cd e2e && npm ci && npx playwright install --with-deps chromium webkit)
      - name: Integration Playwright (@scripted)
        env:
          PW_ARGS: ${{ inputs.args }}
        run: make e2e-int ARGS="$PW_ARGS"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/

  playwright-demo-18nov:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'demo_18nov'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - name: Install deps
        run: |
          (cd backend && uv sync)
          (cd frontend && npm ci)
          (cd e2e && npm ci && npx playwright install --with-deps chromium webkit)
      - name: 18 Nov demo stories (@demo-18nov)
        env:
          PW_ARGS: ${{ inputs.args }}
        run: make e2e-nov18 ARGS="$PW_ARGS"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-demo-18nov
          path: e2e/playwright-report/

  playwright-qa:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'qa'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - name: Install deps
        run: |
          (cd backend && uv sync)
          (cd frontend && npm ci)
          (cd e2e && npm ci && npx playwright install --with-deps chromium)
      - name: Scenario queries Playwright (@qa-scripted)
        env:
          PW_ARGS: ${{ inputs.args }}
        run: set -o pipefail; make e2e-qa ARGS="$PW_ARGS" 2>&1 | tee /tmp/playwright.log
      - name: Show the end of the Playwright output
        if: failure()
        run: tail -n 120 /tmp/playwright.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-qa-report
          path: |
            e2e/playwright-report/
            e2e/test-results/

  playwright-live:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.suite == 'live') ||
      (github.event_name == 'schedule' && vars.NIGHTLY_LIVE == 'true')
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
      LLM_MODEL: ${{ vars.LLM_MODEL || secrets.LLM_MODEL }}
      LLM_TEMPERATURE: ${{ vars.LLM_TEMPERATURE }}
      LLM_REASONING_EFFORT: ${{ vars.LLM_REASONING_EFFORT }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || secrets.OPENAI_MODEL }}
      AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT || secrets.AZURE_OPENAI_ENDPOINT }}
      AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
      AZURE_OPENAI_API_VERSION: ${{ vars.AZURE_OPENAI_API_VERSION }}
    steps:
      - name: Check LLM settings
        run: |
          missing=0
          model="${LLM_MODEL:-$OPENAI_MODEL}"
          use_azure=0
          if [ "$LLM_PROVIDER" = "azure" ]; then use_azure=1; fi
          if [ -z "$LLM_PROVIDER" ] && [ -n "$AZURE_OPENAI_ENDPOINT" ]; then use_azure=1; fi
          if [ "$use_azure" = "1" ]; then
            if [ -z "$AZURE_OPENAI_ENDPOINT" ]; then
              echo "::error::AZURE_OPENAI_ENDPOINT is empty."
              missing=1
            fi
            if [ -z "$AZURE_OPENAI_API_KEY" ]; then
              echo "::error::AZURE_OPENAI_API_KEY is empty. Add it as a repository secret."
              missing=1
            fi
          elif [ -n "$OPENAI_API_KEY" ]; then
            :
          elif [ -n "$AZURE_OPENAI_API_KEY" ]; then
            use_azure=1
            if [ -z "$AZURE_OPENAI_ENDPOINT" ]; then
              echo "::error::AZURE_OPENAI_ENDPOINT is empty."
              missing=1
            fi
          else
            echo "::error::Set OPENAI_API_KEY or AZURE_OPENAI_API_KEY (and matching endpoint for Azure)."
            missing=1
          fi
          if [ -z "$model" ]; then
            echo "::error::LLM_MODEL or OPENAI_MODEL is empty. Add LLM_MODEL as a repository variable or secret."
            missing=1
          fi
          exit $missing
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        run: |
          (cd backend && uv sync)
          (cd frontend && npm ci)
          (cd e2e && npm ci && npx playwright install --with-deps chromium webkit)
      - name: Run live e2e
        run: |
          # Empty repository variables would fail the backend's Settings (see eval-live).
          for v in LLM_PROVIDER LLM_MODEL LLM_TEMPERATURE LLM_REASONING_EFFORT OPENAI_MODEL \
                   AZURE_OPENAI_ENDPOINT AZURE_OPENAI_API_VERSION; do
            if [ -z "${!v}" ]; then unset "$v"; fi
          done
          make e2e-live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-live-report
          path: |
            e2e/playwright-report/
            e2e/results/

  playwright-qa-live:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'qa_live'
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
      LLM_MODEL: ${{ vars.LLM_MODEL || secrets.LLM_MODEL }}
      LLM_TEMPERATURE: ${{ vars.LLM_TEMPERATURE }}
      LLM_REASONING_EFFORT: ${{ vars.LLM_REASONING_EFFORT }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || secrets.OPENAI_MODEL }}
      AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT || secrets.AZURE_OPENAI_ENDPOINT }}
      AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
      AZURE_OPENAI_API_VERSION: ${{ vars.AZURE_OPENAI_API_VERSION }}
    steps:
      - name: Check LLM settings
        run: |
          missing=0
          model="${LLM_MODEL:-$OPENAI_MODEL}"
          use_azure=0
          if [ "$LLM_PROVIDER" = "azure" ]; then use_azure=1; fi
          if [ -z "$LLM_PROVIDER" ] && [ -n "$AZURE_OPENAI_ENDPOINT" ]; then use_azure=1; fi
          if [ "$use_azure" = "1" ]; then
            if [ -z "$AZURE_OPENAI_ENDPOINT" ]; then
              echo "::error::AZURE_OPENAI_ENDPOINT is empty."
              missing=1
            fi
            if [ -z "$AZURE_OPENAI_API_KEY" ]; then
              echo "::error::AZURE_OPENAI_API_KEY is empty. Add it as a repository secret."
              missing=1
            fi
          elif [ -n "$OPENAI_API_KEY" ]; then
            :
          elif [ -n "$AZURE_OPENAI_API_KEY" ]; then
            use_azure=1
            if [ -z "$AZURE_OPENAI_ENDPOINT" ]; then
              echo "::error::AZURE_OPENAI_ENDPOINT is empty."
              missing=1
            fi
          else
            echo "::error::Set OPENAI_API_KEY or AZURE_OPENAI_API_KEY (and matching endpoint for Azure)."
            missing=1
          fi
          if [ -z "$model" ]; then
            echo "::error::LLM_MODEL or OPENAI_MODEL is empty. Add LLM_MODEL as a repository variable or secret."
            missing=1
          fi
          exit $missing
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        run: |
          (cd backend && uv sync)
          (cd frontend && npm ci)
          (cd e2e && npm ci && npx playwright install --with-deps chromium)
      - name: Scenario queries, real model (@qa-live)
        env:
          PW_ARGS: ${{ inputs.args }}
        run: |
          # Empty repository variables would fail the backend's Settings (see eval-live).
          for v in LLM_PROVIDER LLM_MODEL LLM_TEMPERATURE LLM_REASONING_EFFORT OPENAI_MODEL \
                   AZURE_OPENAI_ENDPOINT AZURE_OPENAI_API_VERSION; do
            if [ -z "${!v}" ]; then unset "$v"; fi
          done
          make e2e-qa-live ARGS="$PW_ARGS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-qa-live-report
          path: |
            e2e/playwright-report/
            e2e/results/

  eval-live:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.suite == 'eval') ||
      (github.event_name == 'schedule' && vars.NIGHTLY_LIVE == 'true')
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
      LLM_MODEL: ${{ vars.LLM_MODEL || secrets.LLM_MODEL }}
      LLM_TEMPERATURE: ${{ vars.LLM_TEMPERATURE }}
      LLM_REASONING_EFFORT: ${{ vars.LLM_REASONING_EFFORT }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || secrets.OPENAI_MODEL }}
      AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT || secrets.AZURE_OPENAI_ENDPOINT }}
      AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
      AZURE_OPENAI_API_VERSION: ${{ vars.AZURE_OPENAI_API_VERSION }}
      EVAL_REPEATS: "3"
      EVAL_TOLERANCE: "5"
      SCENARIO: ${{ inputs.scenario }}
    steps:
      - name: Check LLM settings
        run: |
          missing=0
          model="${LLM_MODEL:-$OPENAI_MODEL}"
          use_azure=0
          if [ "$LLM_PROVIDER" = "azure" ]; then use_azure=1; fi
          if [ -z "$LLM_PROVIDER" ] && [ -n "$AZURE_OPENAI_ENDPOINT" ]; then use_azure=1; fi
          if [ "$use_azure" = "1" ]; then
            if [ -z "$AZURE_OPENAI_ENDPOINT" ]; then
              echo "::error::AZURE_OPENAI_ENDPOINT is empty."
              missing=1
            fi
            if [ -z "$AZURE_OPENAI_API_KEY" ]; then
              echo "::error::AZURE_OPENAI_API_KEY is empty. Add it as a repository secret."
              missing=1
            fi
          elif [ -n "$OPENAI_API_KEY" ]; then
            :
          elif [ -n "$AZURE_OPENAI_API_KEY" ]; then
            use_azure=1
            if [ -z "$AZURE_OPENAI_ENDPOINT" ]; then
              echo "::error::AZURE_OPENAI_ENDPOINT is empty."
              missing=1
            fi
          else
            echo "::error::Set OPENAI_API_KEY or AZURE_OPENAI_API_KEY (and matching endpoint for Azure)."
            missing=1
          fi
          if [ -z "$model" ]; then
            echo "::error::LLM_MODEL or OPENAI_MODEL is empty. Add LLM_MODEL as a repository variable or secret."
            missing=1
          fi
          exit $missing
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install backend deps
        run: cd backend && uv sync
      - name: AGENT-LIVE eval
        run: |
          # An unset repository variable arrives as an empty string, which Settings rejects
          # for its Literal fields (LLM_PROVIDER, LLM_REASONING_EFFORT): drop the empty ones.
          for v in LLM_PROVIDER LLM_MODEL LLM_TEMPERATURE LLM_REASONING_EFFORT OPENAI_MODEL \
                   AZURE_OPENAI_ENDPOINT AZURE_OPENAI_API_VERSION; do
            if [ -z "${!v}" ]; then unset "$v"; fi
          done
          GROUP=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.group }}" != "all" ]; then
            GROUP="${{ inputs.group }}"
          fi
          set -o pipefail
          make eval-live GROUP="$GROUP" 2>&1 | tee /tmp/eval.log
      - name: Show the eval summary and failures
        if: always()
        run: |
          enc() { sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g'; }
          md=$(ls -t backend/eval-results/*.md 2>/dev/null | head -n 1)
          if [ -n "$md" ]; then echo "::notice title=eval summary::$(head -c 60000 "$md" | enc)"; fi
          if [ -f /tmp/eval.log ]; then
            fails=$(awk '/^=== /{h=$0; shown=0; next} /\[FAIL\]|\[INVARIANT|ERROR:|Scenario: FAIL/{if(!shown){print h; shown=1} print}' /tmp/eval.log | head -c 60000)
            if [ -n "$fails" ]; then echo "::error title=eval failures::$(printf '%s' "$fails" | enc)"; fi
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-live-results
          path: backend/eval-results/
