name: e2e

# Playwright in CI, on demand only (docs/specs/testing-strategy.md §6). Every PR runs these
# suites locally instead (installing browsers in CI took most of each run).
#   Run workflow → suite "scripted": the INT layer (@scripted), desktop Chrome + mobile WebKit.
#   Run workflow → suite "live": the E2E-LIVE layer (@live), real model.
#   Run workflow → suite "eval": AGENT-LIVE (`make eval-live`).
#   Run workflow → suite "fe": the FE layer (@fe), frontend mock only (`make e2e-fe`).
#     With "update_snapshots" on a branch other than main, the card screenshot baselines are
#     (re)written on ubuntu-latest and committed to that branch.
#   Run workflow → suite "demo": the Day 5 demo rehearsal (`make e2e-demo`, @demo).
# Nightly live runs are opt-in: set the repository variable NIGHTLY_LIVE=true (model cost).

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Which suite to run
        type: choice
        options: [scripted, live, eval, fe, demo]
        default: scripted
      group:
        description: eval-live scenario group (eval suite only)
        type: choice
        options: [intake, case, channels, all]
        default: intake
      update_snapshots:
        description: Rewrite the card screenshot baselines (fe suite only)
        type: boolean
        default: false
  schedule:
    - cron: '30 21 * * *' # 03:00 IST / 00:30 Asia/Riyadh

jobs:
  playwright-fe:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'fe'
    runs-on: ubuntu-latest
    permissions:
      contents: write # only used to commit screenshot baselines (update_snapshots)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - name: Install deps
        run: |
          (cd frontend && npm ci)
          (cd e2e && npm ci && npx playwright install --with-deps chromium webkit)
      - name: Frontend Playwright (@fe)
        if: ${{ !inputs.update_snapshots }}
        run: set -o pipefail; make e2e-fe 2>&1 | tee /tmp/playwright.log
      - name: Write card screenshot baselines
        if: ${{ inputs.update_snapshots }}
        run: set -o pipefail; make e2e-fe ARGS='--update-snapshots=all tests/fe/card-screenshots.spec.ts' 2>&1 | tee /tmp/playwright.log
      - name: Show the end of the Playwright output
        if: failure()
        run: |
          if [ -f /tmp/playwright.log ]; then
            body=$(tail -n 60 /tmp/playwright.log | sed -e 's/\x1b\[[0-9;]*m//g' -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Playwright output (last 60 lines)::${body}"
          fi
      - name: Commit card screenshot baselines to this branch
        if: ${{ inputs.update_snapshots && github.ref != 'refs/heads/main' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/tests/fe/card-screenshots.spec.ts-snapshots/
          if git diff --cached --quiet; then echo "Baselines unchanged"; exit 0; fi
          git commit -m "e2e: card screenshot baselines (ubuntu-latest, run ${{ github.run_id }})"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-fe-report
          path: e2e/playwright-report/

  playwright-demo:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'demo'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - name: Install deps
        run: |
          (cd backend && uv sync)
          (cd frontend && npm ci)
          (cd e2e && npm ci && npx playwright install --with-deps chromium)
      - name: Demo rehearsal (@demo)
        run: set -o pipefail; make e2e-demo 2>&1 | tee /tmp/playwright.log
      - name: Show the end of the Playwright output
        if: failure()
        run: |
          if [ -f /tmp/playwright.log ]; then
            body=$(tail -n 60 /tmp/playwright.log | sed -e 's/\x1b\[[0-9;]*m//g' -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Playwright output (last 60 lines)::${body}"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-demo-report
          path: |
            e2e/playwright-report/
            e2e/test-results/

  playwright-scripted:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'scripted'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - name: Install deps
        run: |
          (cd backend && uv sync)
          (cd frontend && npm ci)
          (cd e2e && npm ci && npx playwright install --with-deps chromium webkit)
      - name: Integration Playwright (@scripted)
        run: make e2e-int
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/

  playwright-live:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.suite == 'live') ||
      (github.event_name == 'schedule' && vars.NIGHTLY_LIVE == 'true')
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      # Accept the model as a repository variable (preferred) or a secret.
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || secrets.OPENAI_MODEL }}
    steps:
      - name: Check OpenAI settings
        run: |
          missing=0
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY is empty. Add it as a repository secret (Settings > Secrets and variables > Actions > Secrets)."
            missing=1
          fi
          if [ -z "$OPENAI_MODEL" ]; then
            echo "::error::OPENAI_MODEL is empty. Add it as a repository variable (Settings > Secrets and variables > Actions > Variables)."
            missing=1
          fi
          exit $missing
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        run: |
          (cd backend && uv sync)
          (cd frontend && npm ci)
          (cd e2e && npm ci && npx playwright install --with-deps chromium webkit)
      - name: Run live e2e
        run: make e2e-live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-live-report
          path: |
            e2e/playwright-report/
            e2e/results/

  eval-live:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.suite == 'eval') ||
      (github.event_name == 'schedule' && vars.NIGHTLY_LIVE == 'true')
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || secrets.OPENAI_MODEL }}
      EVAL_REPEATS: "3"
      EVAL_TOLERANCE: "5"
    steps:
      - name: Check OpenAI settings
        run: |
          missing=0
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY is empty. Add it as a repository secret."
            missing=1
          fi
          if [ -z "$OPENAI_MODEL" ]; then
            echo "::error::OPENAI_MODEL is empty. Add it as a repository variable or secret."
            missing=1
          fi
          exit $missing
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install backend deps
        run: cd backend && uv sync
      - name: AGENT-LIVE eval
        run: |
          GROUP=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.group }}" != "all" ]; then
            GROUP="${{ inputs.group }}"
          fi
          set -o pipefail
          make eval-live GROUP="$GROUP" 2>&1 | tee /tmp/eval.log
      - name: Show the eval summary and failures
        if: always()
        run: |
          enc() { sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g'; }
          md=$(ls -t backend/eval-results/*.md 2>/dev/null | head -n 1)
          if [ -n "$md" ]; then echo "::notice title=eval summary::$(head -c 60000 "$md" | enc)"; fi
          if [ -f /tmp/eval.log ]; then
            fails=$(awk '/^=== /{h=$0; shown=0; next} /\[FAIL\]|\[INVARIANT|ERROR:|Scenario: FAIL/{if(!shown){print h; shown=1} print}' /tmp/eval.log | head -c 60000)
            if [ -n "$fails" ]; then echo "::error title=eval failures::$(printf '%s' "$fails" | enc)"; fi
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-live-results
          path: backend/eval-results/
