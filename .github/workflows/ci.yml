name: ci

# The per-PR layers from docs/specs/testing-strategy.md §6: backend (BE, incl. AGENT-DET)
# and frontend (FE checks and Vitest). Playwright suites (INT, FE Playwright, E2E-LIVE) run
# on the author's machine (`make e2e-int`, `make e2e-live`), with results in the PR;
# e2e.yml can run them in CI on demand.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install backend deps
        run: cd backend && uv sync
      # Same as `make check-be`, one step each so a failure names its tool; mypy errors are
      # also printed as annotations.
      - name: Ruff
        run: cd backend && uv run ruff check app tests scripts && uv run ruff format --check app tests scripts
      - name: Mypy
        if: success() || failure()
        run: |
          cd backend
          set +e
          uv run mypy app 2>&1 | tee mypy.log
          status=${PIPESTATUS[0]}
          grep -E "^app/.*: error:" mypy.log | head -40 | while IFS= read -r line; do
            file=${line%%:*}
            rest=${line#*:}
            lineno=${rest%%:*}
            echo "::error file=backend/${file},line=${lineno},title=mypy::${line}"
          done
          exit $status
      - name: Tests (pytest, incl. AGENT-DET)
        if: success() || failure()
        # Same as `make test-be`; failing tests are also printed as annotations.
        run: |
          cd backend
          set +e
          uv run pytest -q -rfE 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          grep -E "^(FAILED|ERROR) tests/" pytest.log | head -40 | while IFS= read -r line; do
            echo "::error title=pytest::${line}"
          done
          exit $status

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        run: cd frontend && npm ci
      # Same commands as `make check-fe`, one step each so a failure names its tool.
      - name: ESLint
        run: cd frontend && npm run lint
      - name: TypeScript
        if: success() || failure()
        run: cd frontend && npx tsc -b --noEmit
      - name: Prettier
        if: success() || failure()
        run: |
          cd frontend
          files=$(npx prettier --list-different . || true)
          for f in $files; do echo "::error file=frontend/$f::Not formatted by Prettier (run: cd frontend && npm run format:write)"; done
          npx prettier --check .
      - name: Tests (Vitest)
        run: make test-fe
