name: ci

# The per-PR layers from docs/specs/testing-strategy.md §6:
# backend (BE, incl. AGENT-DET), frontend (FE), integration (INT).
# Live layers run from e2e.yml.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install backend deps
        run: cd backend && uv sync
      - name: Checks (ruff, mypy)
        run: make check-be
      - name: Tests (pytest, incl. AGENT-DET)
        run: make test-be

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        run: cd frontend && npm ci
      - name: Checks (ESLint, tsc, Prettier)
        run: make check-fe
      - name: Tests (Vitest)
        run: make test-fe

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - name: Install backend deps
        run: cd backend && uv sync
      - name: Install frontend deps
        run: cd frontend && npm ci
      - name: Install Playwright and browsers
        run: cd e2e && npm ci && npx playwright install --with-deps chromium webkit
      - name: Integration Playwright (@scripted, desktop Chrome and mobile WebKit)
        run: make e2e-int
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
