services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: inquiry
      POSTGRES_PASSWORD: inquiry
      POSTGRES_DB: inquiry
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    working_dir: /app
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
    ports:
      - '${BACKEND_HOST_PORT:-8000}:8000'
    env_file:
      - backend/.env
    environment:
      STATE_BACKEND: postgres
      DATABASE_URL: postgresql+psycopg://inquiry:inquiry@postgres:5432/inquiry
    depends_on:
      - postgres
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    image: node:20-bookworm-slim
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - '5173:5173'
    environment:
      VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8000}
      VITE_MOCK: '0'
      VITE_DEMO: ${VITE_DEMO:-0}
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"

volumes:
  frontend_node_modules:
  backend_venv:
  postgres_data:
