# Business rules the agent enforces (docs/specs/l3-reliable-intake.md §3.7).
#
# Loaded and validated once at start-up (POLICY_PATH, default: this file). A file that
# doesn't validate stops the app with a clear error. Change a rule here, not in code or
# in the system prompt: validators, can_submit, cards and the prompt's "Rules in force"
# block all read this file.

# Product lines (unit type ids in master data). Requirements §1 and §7.1.1.
product_lines: [store, media, specialty]

# What happens when a CR already has a Tenant Central account (assumption 3).
#   sign_in       — point the applicant to Sign In; no inquiry is created.
#   allow_inquiry — the inquiry continues (requirements §7.1).
existing_tenant_policy: sign_in

# The public page and the CR (demo feedback §3.1, 4 Nov 2026):
#   lookup           — a CR number typed in the public chat is checked in the registry.
#   ask_then_sign_in — the agent asks "Do you have a CR?": Yes → sign in, No → carry on in
#                      chat. The public page never takes or looks up a CR number.
# Self-service channel only: call-centre staff keep the lookup (D3).
public_cr_check: ask_then_sign_in

# A tenant signed in to Tenant Central (Leasing Opportunities) is already verified by Azure
# AD: the email link and SMS code are skipped (intake channels §3.5, assumption D4).
signed_in_skips_verification: true

# Malls one inquiry can cover (assumption 2). Another inquiry can follow for the rest.
max_malls_per_inquiry: 1

phone:
  # Saudi numbers (+966) are always accepted. Other countries: "any", or a list of
  # calling codes without "+", e.g. ["971", "973"] (assumption 4).
  allowed_countries: any

# How contact details are verified (assumption 1). The POC supports exactly these
# values; other channels arrive with real providers.
verification:
  email: link
  mobile: otp

# Resend limits for the email link and the OTP (L3 §3.3; read from step 19).
resend:
  cooldown_seconds: 60
  max_per_hour: 5

# Documents (requirements §7.1.1 documents table). Every document type is listed once.
documents:
  required: [company_profile, brand_profile]
  optional: [cr_certificate, vat_certificate, national_id, national_address, articles_of_association]

# Same CR and mall as an open inquiry (L3 §3.12; read from step 21b): warn | block.
duplicate_policy: warn

# A follow-on inquiry reuses verified details for this many hours (L3 §3.11; step 21b).
follow_on_reuse_hours: 24

# ---- Review lifecycle (L4 §3.2–3.5) ---------------------------------------------------
# Product line → first- and second-level reviewer role (requirements §7.1.1 b). The queue's
# region is the mall's region in master data (assumption L4 A5).
#
# First-level review in every product line (demo feedback §3.2): the Lease Admin of the
# mall's region approves the documents and the first level; the role above gives the final
# approval. Leave empty for one role doing both levels.
first_level_review_role: lease_admin

review_routing:
  store: rlm_store
  media: rplm_media
  specialty: rplm_specialty

# Additional tenant contacts requested at second review (requirements §7.1.1 c).
second_level_contacts:
  required: [authorized_signatory, billing_contact]
  optional: [leasing_manager, financial_controller, company_admin]

# Reviewers pick one when rejecting (synthetic list, L4 A8; feeds L5 insights).
rejection_categories: [incomplete_documents, not_a_fit, no_space, other]

# Told to the applicant after a rejection.
after_rejection: >-
  You can raise a new inquiry at any time, for example with updated documents or for
  another mall.

# Final approval needs the required contacts (above).
require_contacts_before_approval: true

# First-level approval opens a contacts request automatically (requirements §7.1.1 b,
# "on contact creation"; L4 A10). Off since flow v2 (V6): the contacts request opens when
# the final reviewer answers "Approve Lead?" with Yes (`lead_approval` below).
auto_request_contacts_after_first_approval: false

# The second level as on the v2 chart (flow v2 §3.7, V6, V11): the Regional Sales Manager
# assigns the unit, may ask for Forecasted Sales Data, then decides "Approve Lead?". Yes →
# contacts request → the same reviewer gives the final "Approve Lead".
lead_approval:
  enabled: true
  require_unit_assigned: true

# Per-document approval (demo feedback §3.4, day R2): the first-level reviewer approves or
# rejects each document; first-level approval waits until every required one is approved.
# A re-uploaded document needs approval again.
document_approval: true

# Document expiry (demo feedback §3.4, M9). The date comes from the document review service
# or the Lease Admin. An expired document can't be approved; one of these types with no
# known date needs its date confirmed first. Less than `expiring_soon_days` away: "Expiring
# soon", still approvable.
document_expiry:
  expiring_soon_days: 14
  doc_types: [company_profile, brand_profile]

# Tenant contacts at second review (demo feedback §3.5, day R2).
contacts:
  # Flow v2 (V7, M15, M26): no per-contact approval; the required contacts must be given
  # before the final "Approve Lead". true: the Leasing Admin approves each one (R2).
  approval_required: false
  # The contacts request opens with "Are you the authorised signatory?".
  ask_signatory: true
  # "Yes, I'm the signatory" copies the verified primary contact, approved on entry (M8).
  applicant_signatory_needs_approval: false

# Azure AD accounts (flow v2 §3.6, V9). Reject Lead revokes the invitation made at first
# approval; an account that existed before the inquiry is never touched (assumption A1).
identity:
  revoke_on_lead_rejection: true

# ---- Proactive work (L5 §3.1–3.3) -----------------------------------------------------
# Demo values. A trigger fires once per case per period: a stay in one review stage, or
# one open request. Every decision is in the audit log.
proactive:
  # A case in first or second review this long → "Needs attention" + email to the queue.
  review_stall_hours: 48
  # Still there after this long → flagged to the region manager for that role.
  review_escalate_hours: 96
  # A re-upload, contacts or sales-data request unanswered this long → drafted reminder.
  tenant_reminder_hours: 72
  # At most one proactive message to the applicant per case in this many hours.
  tenant_proactive_min_hours: 48
  # false: a reviewer approves each reminder (tier 2); true: reminders send (tier 1).
  reminder_pre_approved: false
  # Messages to the applicant wait outside these hours (internal flags don't).
  quiet_hours:
    start: "22:00"
    end: "08:00"
    timezone: Asia/Riyadh
  # Why a reviewer dismissed an item (counted in the console).
  dismiss_reasons: [not_needed, already_handled, applicant_contacted, other]
