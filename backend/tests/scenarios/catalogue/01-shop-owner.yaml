id: 01-shop-owner
layers:
- e2e_script
model_steps:
- content: Hi — when you're ready, send your company's CR number.
- content: ''
  tool_calls:
  - name: verify_cr
    args:
      cr_number: '1010123456'
    id: a1
    type: tool_call
- content: Thanks — your company details are in the card below.
- content: ''
  tool_calls:
  - name: update_draft
    args:
      fields:
      - key: brand_name_en
        value: Bean Street
        source: user
      - key: brand_name_ar
        value: بين ستريت
        source: derived
      - key: unit_type
        value: specialty
        source: derived
      - key: sales_category
        value: fnb_cafe
        source: derived
      - key: malls
        value:
        - riyadh-mall-a
        source: user
    id: a2
    type: tool_call
- content: Got it — check the brand summary card.
- content: ''
  tool_calls:
  - name: update_draft
    args:
      fields:
      - key: first_name
        value: Sara
        source: user
      - key: last_name
        value: Ali
        source: user
      - key: email
        value: sara@beanstreet.example
        source: user
      - key: contact_number
        value: '0501234567'
        source: user
    id: a3
    type: tool_call
- content: ''
  tool_calls:
  - name: send_verification
    args:
      resend: false
    id: a4
    type: tool_call
- content: Open the link we emailed you and enter the SMS code in the box.
