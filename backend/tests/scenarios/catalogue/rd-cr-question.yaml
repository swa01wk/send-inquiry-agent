id: rd-cr-question
layers:
- e2e_script
- agent_det
model_steps:
- content: Signing in to Tenant Central is the quickest way — your company details are already on file there. Use the Sign in button below.
- content: You can type your company and brand details here, or upload your Company Profile and Brand Profile and I'll fill them in for you to check on the card.
  tool_calls:
  - name: suggest_replies
    args:
      suggestions:
      - I'll type them
      - I'll upload the profiles
    id: rd1a
    type: tool_call
- content: What is your registered company name and address?
- content: ''
  tool_calls:
  - name: update_draft
    args:
      fields:
      - key: company_name
        value: Acme Trading LLC
        source: user
      - key: company_address
        value: King Abdullah Road, Riyadh
        source: user
    id: rd1
    type: tool_call
- content: Tell me about your brand and the space you're looking for.
title: Re-demo CR question (public page)
