id: happy-path-cr
layers:
- agent_det
model_steps:
- content: ''
  tool_calls:
  - name: verify_cr
    args:
      cr_number: '1010123456'
    id: s1
    type: tool_call
- content: Thanks — I pulled your company details from the CR. Please confirm them
    on the card.
- content: Tell me about the brand and format you want to open.
- content: ''
  tool_calls:
  - name: update_draft
    args:
      fields:
      - key: brand_name_en
        value: Bean Street
        source: user
      - key: brand_name_ar
        value: بين ستريت
        source: derived
      - key: unit_type
        value: specialty
        source: derived
      - key: sales_category
        value: fnb_cafe
        source: derived
      - key: malls
        value:
        - riyadh-mall-a
        source: user
      - key: first_name
        value: Sara
        source: user
      - key: last_name
        value: Ali
        source: user
      - key: email
        value: sara@beanstreet.example
        source: user
      - key: contact_number
        value: '+966501234567'
        source: user
    id: s2
    type: tool_call
- content: Please confirm the details I filled in for you.
- content: ''
  tool_calls:
  - name: send_verification
    args:
      resend: false
    id: s3
    type: tool_call
- content: Click the link in your email and enter the SMS code in the box.
- content: When you're ready, upload Company Profile and Brand Profile in the checklist.
title: Happy path with CR
