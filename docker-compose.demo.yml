# `make demo`: every dev and console flag on (mock integrations only).
services:
  backend:
    environment:
      DEV_TOOLS: 'true'
      REVIEWER_CONSOLE: 'true'
      CALLCENTRE_CONSOLE: 'true'
      TENANT_PORTAL: 'true'
      PROACTIVE_ENABLED: 'true'
      OTP_MOCK_CODE: '1234'
      DATA_DIR: /app/.data
  frontend:
    environment:
      VITE_DEMO: '1'
      VITE_DEV_TOOLS: '1'
      VITE_REVIEWER_CONSOLE: '1'
      VITE_CALLCENTRE_CONSOLE: '1'
      VITE_TENANT_PORTAL: '1'
